# Free model configurations for TrueForge (Gemini free tier, Groq free tier, and local Ollama)
models:
  # 1. Google Gemini (Free tier via Google AI Studio API key)
  - name: "gemini/gemini-2.5-flash"
    provider: "gemini"
    api_key_env: "GEMINI_API_KEY"
    params:
      temperature: 0.2
      max_tokens: 4096

  # 2. Groq (Free tier with ultra-fast inference)
  - name: "groq/llama-3.3-70b-versatile"
    provider: "groq"
    api_key_env: "GROQ_API_KEY"
    params:
      temperature: 0.2
      max_tokens: 4096

  # 3. Ollama (100% Local, open-source, and free - no API key required)
  - name: "ollama/qwen2.5-coder:7b"
    provider: "openai-compatible"
    base_url: "http://localhost:11434/v1"
    params:
      temperature: 0.2
      max_tokens: 4096

  # 4. Groq lightweight (Fast inline edits)
  - name: "groq/llama-3.1-8b-instant"
    provider: "groq"
    api_key_env: "GROQ_API_KEY"
    params:
      temperature: 0.1
      max_tokens: 2048
