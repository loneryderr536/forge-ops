<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge-ops</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="header">
    <strong>Forge-ops Agent</strong>
    <span id="meter">Context: 0k / 25k tokens · 0 files</span>
  </div>
  <div id="banner"></div>
  <div id="chat-log"></div>
  <div id="input-container">
    <textarea id="prompt-input" placeholder="Ask Forge-ops (e.g. Add flask config CLI command...)"></textarea>
    <div class="btn-row">
      <button id="send-btn">Send</button>
      <button id="stop-btn" class="secondary" disabled>Stop</button>
      <button id="undo-btn" class="secondary">Undo Run</button>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
